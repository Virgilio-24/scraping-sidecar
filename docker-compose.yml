services:
  sidecar:
    build: .
    restart: unless-stopped
    ports:
      - "3002:3003"
      - "6080:6080"
    environment:
      PORT: 3003
      BROWSER_HEADLESS: "true"
      NAVIGATION_TIMEOUT_MS: 45000
      PAGE_WAIT_MS: 4000
      RETRY_ATTEMPTS: 3
      PREWARM_HOME_MS: 0
      # PROXY_URLS: "http://user:pass@proxy1:port,http://user:pass@proxy2:port"
    volumes:
      - sessions:/app/.sessions

volumes:
  sessions:
